name: Feature Request
description: Suggest a change or addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it concrete. What problem does this solve?

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what breaks?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you change or add?
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Must remain zero pip dependencies
        - label: Must preserve citation provenance on all outputs
